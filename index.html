<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bathroom walk-through · ห้องน้ำ 360°</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #222;
    font-family: -apple-system, "Sukhumvit Set", Thonburi, Tahoma, sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #view.dragging { cursor: grabbing; }
  .hot { position: fixed; width: 150px; transform: translate(-50%, -28px); text-align: center; cursor: pointer; }
  .hot .ring { width: 56px; height: 56px; margin: 0 auto 6px; border-radius: 50%;
    background: rgba(255,255,255,.85); border: 4px solid #2e8b57; box-shadow: 0 2px 10px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center; font-size: 30px; color: #2e8b57; box-sizing: border-box; }
  .hot:hover .ring { background: #2e8b57; color: #fff; }
  .hot .label { display: inline-block; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.6);
    color: #fff; font-size: 15px; line-height: 1.25; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #title { position: fixed; left: 12px; top: 12px; padding: 8px 12px; border-radius: 8px;
    background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 1.35; max-width: 70vw; }
  #title small { color: #ddd; font-size: 13px; }
  #map { position: fixed; right: 12px; bottom: 12px; width: 230px; background: rgba(255,255,255,.9);
    border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.4); }
  #map .spot { cursor: pointer; }
  #help { position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 8px;
    background: rgba(0,0,0,.55); color: #eee; font-size: 13px; line-height: 1.4; }
  @media (max-width: 600px) { #map { width: 160px; } #help { display: none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hots"></div>
<div id="fade"></div>
<div id="title"></div>
<svg id="map" viewBox="-160 -45 470 345" aria-label="plan">
  <rect x="65" y="-20" width="150" height="94" fill="#e9dccb"/>
  <rect x="65" y="74" width="85" height="13" fill="#e9dccb"/>
  <rect x="-62" y="4" width="47" height="67" rx="5" fill="#fbe3dd" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <g fill="none" stroke="#555" stroke-width="13" stroke-linecap="butt">
    <path d="M 52 -26.5 H 228"/>
    <path d="M 58.5 -20 V 74 M 221.5 -20 V 74"/>
    <path d="M -6.5 74 V 141 M -6.5 237 V 300"/>
    <path d="M 156.5 74 V 100 M 156.5 170 V 300"/>
    <path d="M -13 243.5 H 163"/>
    <path d="M -150 80.5 H -13 M 163 80.5 H 310"/>
  </g>
  <rect x="0" y="74" width="65" height="13" fill="#555"/>
  <ellipse cx="45" cy="125" rx="18" ry="30" fill="#fff" stroke="#888" stroke-width="2"/>
  <rect x="108.5" y="205" width="41" height="32" rx="6" fill="#fff" stroke="#888" stroke-width="2"/>
  <rect x="155" y="29" width="45" height="45" fill="#c9a27a"/>
  <text x="75" y="285" font-size="20" text-anchor="middle" fill="#444">Stairs · บันได</text>
  <circle cx="-88" cy="190" r="75" fill="none" stroke="#2e8b57" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="-90" y="255" font-size="20" text-anchor="middle" fill="#444">Bedroom A · ห้องนอน A</text>
  <text x="235" y="160" font-size="20" text-anchor="middle" fill="#444">Bedroom B</text>
  <text x="235" y="182" font-size="20" text-anchor="middle" fill="#444">ห้องนอน B</text>
  <g id="spots"></g>
  <path id="wedge" d="M 0 0 L -30 -60 A 67 67 0 0 1 30 -60 Z" fill="rgba(46,139,87,.35)" stroke="#2e8b57" stroke-width="2"/>
</svg>
<div id="help">Drag to look around · scroll or pinch to zoom · tap the green circles or the map to move<br>
ลากเพื่อหมุนดูรอบ ๆ · แตะวงกลมสีเขียวหรือจุดบนแผนผังเพื่อเดินไปจุดอื่น</div>
<script>
// Spots match SPOTS in scripts/render_blender.py: plan cm (x east, y south), eye height in metres.
const SPOTS = {
  bedroom_a: { xy: [-90, 190], z: 1.50, yaw: 90,
    name: "Bedroom A, outside the door", th: "หน้าประตูห้องนอน A (ฝั่งห้องพ่อแม่)",
    short: "Bedroom A<br>ห้องนอน A", links: ["room"] },
  room: { xy: [60, 205], z: 1.50, yaw: 15,
    name: "Inside the bathroom, by the door", th: "ในห้องน้ำ ข้างประตู",
    short: "Bathroom<br>ห้องน้ำ", links: ["bedroom_a", "wheelchair", "shower"] },
  wheelchair: { xy: [115, 128], z: 1.15, yaw: 270,
    name: "Seated, beside the toilet (wheelchair eye height)", th: "มุมมองตอนนั่งรถเข็น ข้างชักโครก",
    short: "Beside toilet (seated)<br>ข้างชักโครก (นั่ง)", links: ["room", "shower"] },
  shower: { xy: [95, 50], z: 1.50, yaw: 95, pitch: -40,
    name: "In the shower", th: "ในที่อาบน้ำ",
    short: "Shower<br>ที่อาบน้ำ", links: ["room", "wheelchair"] },
};

// World axes: x east, y up, z north. Each cube face: forward, screen-right and screen-up
// vectors, matching equirect_to_cube() in scripts/render_blender.py.
const N = [0, 0, 1], E = [1, 0, 0], U = [0, 1, 0], neg = v => v.map(c => -c);
const FACES = { f: [N, E, U], r: [E, neg(N), U], b: [neg(N), neg(E), U],
                l: [neg(E), N, U], u: [U, E, neg(N)], d: [neg(U), E, N] };
const CHEVRON = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>';
const GRID = 16;   // cells per face edge; small cells keep the affine texture warp invisible

const canvas = document.getElementById("view"), ctx = canvas.getContext("2d");
const fade = document.getElementById("fade"), hots = document.getElementById("hots");
let yaw = 0, pitch = -5, fov = 80, current = null, images = {}, queued = false;

// Unit-cube grid points per face, with texture coordinates in 0..1
const mesh = {};
for (const [k, [fw, rt, up]] of Object.entries(FACES)) {
  const pts = [];
  for (let j = 0; j <= GRID; j++) for (let i = 0; i <= GRID; i++) {
    const a = i / GRID * 2 - 1, b = j / GRID * 2 - 1;
    pts.push({ p: [0, 1, 2].map(c => fw[c] + a * rt[c] - b * up[c]), u: i / GRID, v: j / GRID });
  }
  mesh[k] = pts;
}

const cache = {};
function load(name) {
  if (!cache[name]) {
    cache[name] = {};
    for (const k of Object.keys(FACES)) {
      const img = new Image();
      img.onload = () => name === current && redraw();
      img.src = `pano/${name}/${k}.jpg`;
      cache[name][k] = img;
    }
  }
  return cache[name];
}

function basis() {
  const y = yaw * Math.PI / 180, p = pitch * Math.PI / 180;
  const F = [Math.sin(y) * Math.cos(p), Math.sin(p), Math.cos(y) * Math.cos(p)];
  const R = [Math.cos(y), 0, -Math.sin(y)];
  const Up = [F[1] * R[2] - F[2] * R[1], F[2] * R[0] - F[0] * R[2], F[0] * R[1] - F[1] * R[0]];
  return { F, R, Up };
}

function draw() {
  queued = false;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#222";
  ctx.fillRect(0, 0, w, h);
  ctx.imageSmoothingQuality = "high";
  const { F, R, Up } = basis();
  const f = (Math.min(w, h) / 2) / Math.tan(fov * Math.PI / 360), cx = w / 2, cy = h / 2;
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  for (const k of Object.keys(FACES)) {
    const img = images[k];
    if (!img || !img.complete || !img.naturalWidth) continue;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scr = mesh[k].map(({ p, u, v }) => {
      const z = dot(p, F);
      return { x: cx + f * dot(p, R) / z, y: cy - f * dot(p, Up) / z, z, u: u * iw, v: v * ih };
    });
    for (let j = 0; j < GRID; j++) for (let i = 0; i < GRID; i++) {
      const a = scr[j * (GRID + 1) + i], b = scr[j * (GRID + 1) + i + 1];
      const c = scr[(j + 1) * (GRID + 1) + i], d = scr[(j + 1) * (GRID + 1) + i + 1];
      if (a.z < 0.05 || b.z < 0.05 || c.z < 0.05 || d.z < 0.05) continue;
      const xs = [a.x, b.x, c.x, d.x], ys = [a.y, b.y, c.y, d.y];
      if (Math.max(...xs) < 0 || Math.min(...xs) > w || Math.max(...ys) < 0 || Math.min(...ys) > h) continue;
      tri(img, a, b, c);
      tri(img, d, c, b);
    }
  }
  placeHotspots(F, R, Up, f, dpr);
  document.getElementById("wedge").setAttribute("transform",
    `translate(${SPOTS[current].xy[0]} ${SPOTS[current].xy[1]}) rotate(${yaw})`);
}

// Draw one textured triangle: clip to the (slightly grown) screen triangle, then map the image
// with the affine transform that takes its texture corners onto the screen corners.
function tri(img, p0, p1, p2) {
  const mx = (p0.x + p1.x + p2.x) / 3, my = (p0.y + p1.y + p2.y) / 3;
  const grow = q => { const dx = q.x - mx, dy = q.y - my, l = Math.hypot(dx, dy) || 1; return [q.x + dx / l, q.y + dy / l]; };
  const [g0, g1, g2] = [grow(p0), grow(p1), grow(p2)];
  const du1 = p1.u - p0.u, dv1 = p1.v - p0.v, du2 = p2.u - p0.u, dv2 = p2.v - p0.v;
  const det = du1 * dv2 - du2 * dv1;
  if (!det) return;
  const a = ((p1.x - p0.x) * dv2 - (p2.x - p0.x) * dv1) / det;
  const b = ((p1.y - p0.y) * dv2 - (p2.y - p0.y) * dv1) / det;
  const c = ((p2.x - p0.x) * du1 - (p1.x - p0.x) * du2) / det;
  const d = ((p2.y - p0.y) * du1 - (p1.y - p0.y) * du2) / det;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(g0[0], g0[1]); ctx.lineTo(g1[0], g1[1]); ctx.lineTo(g2[0], g2[1]);
  ctx.closePath();
  ctx.clip();
  ctx.setTransform(a, b, c, d, p0.x - a * p0.u - c * p0.v, p0.y - b * p0.u - d * p0.v);
  const u0 = Math.max(0, Math.min(p0.u, p1.u, p2.u) - 2), v0 = Math.max(0, Math.min(p0.v, p1.v, p2.v) - 2);
  const u1 = Math.min(img.naturalWidth, Math.max(p0.u, p1.u, p2.u) + 2);
  const v1 = Math.min(img.naturalHeight, Math.max(p0.v, p1.v, p2.v) + 2);
  ctx.drawImage(img, u0, v0, u1 - u0, v1 - v0, u0, v0, u1 - u0, v1 - v0);
  ctx.restore();
}

function direction(a, b) {
  const dx = b.xy[0] - a.xy[0], dy = b.xy[1] - a.xy[1];
  const lon = Math.atan2(dx, -dy), dist = Math.hypot(dx, dy) / 100;
  const lat = Math.max(-30, Math.min(-12, Math.atan2(-a.z, dist) * 180 / Math.PI)) * Math.PI / 180;
  return [Math.sin(lon) * Math.cos(lat), Math.sin(lat), Math.cos(lon) * Math.cos(lat)];
}

function placeHotspots(F, R, Up, f, dpr) {
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  for (const el of hots.children) {
    const v = el._dir, z = dot(v, F);
    const x = (canvas.width / 2 + f * dot(v, R) / z) / dpr, y = (canvas.height / 2 - f * dot(v, Up) / z) / dpr;
    const on = z > 0.2 && x > -80 && x < innerWidth + 80 && y > -80 && y < innerHeight + 80;
    el.style.display = on ? "" : "none";
    if (on) { el.style.left = x + "px"; el.style.top = y + "px"; }
  }
}

function redraw() { if (!queued) { queued = true; requestAnimationFrame(draw); } }

function go(name) {
  const spot = SPOTS[name];
  const next = load(name);
  fade.style.opacity = current ? 1 : 0;
  setTimeout(() => {
    images = next;
    hots.innerHTML = "";
    for (const target of spot.links) {
      const el = document.createElement("div");
      el.className = "hot";
      el.innerHTML = `<div class="ring">${CHEVRON}</div><div class="label">${SPOTS[target].short}</div>`;
      el._dir = direction(spot, SPOTS[target]);
      el.addEventListener("click", () => go(target));
      hots.appendChild(el);
    }
    current = name;
    yaw = spot.yaw; pitch = spot.pitch ?? -5;
    document.getElementById("title").innerHTML = `${spot.name}<br><small>${spot.th}</small>`;
    document.querySelectorAll("#spots circle").forEach(c =>
      c.setAttribute("fill", c.dataset.spot === name ? "#2e8b57" : "#fff"));
    draw();
    setTimeout(() => (fade.style.opacity = 0), 60);
    for (const other of spot.links) load(other);
  }, current ? 250 : 0);
}

const g = document.getElementById("spots");
for (const [name, s] of Object.entries(SPOTS)) {
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  Object.entries({ cx: s.xy[0], cy: s.xy[1], r: 11, stroke: "#2e8b57", "stroke-width": 4, class: "spot" })
    .forEach(([k, v]) => c.setAttribute(k, v));
  c.dataset.spot = name;
  c.addEventListener("click", () => go(name));
  g.appendChild(c);
}

let drag = null;
const pointers = new Map();
canvas.addEventListener("pointerdown", e => {
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  drag = { x: e.clientX, y: e.clientY, yaw, pitch, fov, pinch: null };
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    drag.pinch = Math.hypot(a[0] - b[0], a[1] - b[1]);
  }
  canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", e => {
  if (!drag || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2 && drag.pinch) {
    const [a, b] = [...pointers.values()];
    fov = Math.max(35, Math.min(100, drag.fov * drag.pinch / Math.hypot(a[0] - b[0], a[1] - b[1])));
  } else if (pointers.size === 1) {
    const k = fov / Math.min(innerWidth, innerHeight);
    yaw = drag.yaw - (e.clientX - drag.x) * k;
    pitch = Math.max(-88, Math.min(88, drag.pitch + (e.clientY - drag.y) * k));
  }
  redraw();
});
const end = e => {
  pointers.delete(e.pointerId);
  if (!pointers.size) { drag = null; canvas.classList.remove("dragging"); }
  else if (drag) { const [p] = [...pointers.values()]; Object.assign(drag, { x: p[0], y: p[1], yaw, pitch, pinch: null }); }
};
canvas.addEventListener("pointerup", end);
canvas.addEventListener("pointercancel", end);
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  fov = Math.max(35, Math.min(100, fov + e.deltaY * 0.05));
  redraw();
}, { passive: false });
addEventListener("keydown", e => {
  const step = { ArrowLeft: [-5, 0], ArrowRight: [5, 0], ArrowUp: [0, 5], ArrowDown: [0, -5] }[e.key];
  if (!step) return;
  yaw += step[0]; pitch = Math.max(-88, Math.min(88, pitch + step[1]));
  redraw();
});
addEventListener("resize", redraw);
const start = new URLSearchParams(location.search).get("spot");
go(start in SPOTS ? start : "bedroom_a");
</script>
</body>
</html>
